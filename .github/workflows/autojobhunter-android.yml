name: Android debug APK
on:
  push:
    branches: [autojobhunter-android-staging]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: node --test AutoJobHunter/tests/core.test.js
      - name: Build debug APK
        working-directory: AutoJobHunter/android
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoJobHunter-debug-apk
          path: AutoJobHunter/android/app/build/outputs/apk/debug/app-debug.apk
