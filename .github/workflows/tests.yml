name: Scrappy regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check city-types.js
          node --check city-facets.js
          node --check field-observations.js
          node --check live-vancouver.js
          node --check route-planner.js
      - name: Unit and regression tests
        run: node --test scripts/*.test.cjs
