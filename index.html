<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183e34"><title>Scrappy — Vancouver Scrap Prices</title><link rel="manifest" href="manifest.webmanifest"><style>body{font:16px system-ui;background:#f4f7f5;color:#183e34;margin:0}header{background:#183e34;color:white;padding:22px}main{max-width:780px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0001}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}button{background:#176c53;color:white;border:0;margin-top:12px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;text-align:left;border-bottom:1px solid #ddd}small{color:#53645c}</style></head><body><header><h1>Scrappy</h1><div>Compare Vancouver scrap-metal yard prices</div></header><main><section><h2>Add receipt price</h2><form id="entry"><label>Yard<input name="yard" required placeholder="e.g. local recycling yard"></label><label>Metal type<input name="metal" required placeholder="e.g. insulated copper wire"></label><label>Weight (lb)<input name="weight" type="number" min=".001" step="any" required></label><label>Amount paid (CAD)<input name="paid" type="number" min="0" step=".01" required></label><label>Date<input name="date" type="date" required></label><label>Receipt reference (optional)<input name="reference"></label><button>Save price</button></form><small>Enter values from your receipt. Verify weight and amount before saving.</small></section><section><h2>Price observations</h2><label>Filter metal<input id="filter" placeholder="Search metal type"></label><div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Yard</th><th>Metal</th><th>$/lb</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><button id="export">Export CSV</button><small>Stored only on this device/browser until a shared backend is added.</small></section></main><script src="app.js"></script></body></html>
